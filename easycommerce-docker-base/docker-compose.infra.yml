
# Se usa SIEMPRE junto al compose base (aporta la red y la base de datos):
#   docker compose -f docker-compose.yml -f docker-compose.infra.yml up -d n8n

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Defini N8N_VERSION en .env (version estable y parcheada)}
    container_name: easycommerce-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-America/Argentina/Jujuy}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Jujuy}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      NODE_ENV: production
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defini N8N_ENCRYPTION_KEY en .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # Nodos que no vamos a usar: menos superficie de ataque
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.git","n8n-nodes-base.ssh"]'
      # Registro de ejecuciones (requisito 6 del punto 13)
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"   # horas (14 dias)
    security_opt:
      - no-new-privileges:true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easycommerce-network

# ---------- AUTOMATIZACION: volumen ----------
volumes:
  n8n_data: