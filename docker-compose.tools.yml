name: easycommerce-tools

services:
  # ---------- Jira con SU PROPIA base ----------
  jira-db:
    image: postgres:15
    container_name: easycommerce-jira-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${JIRA_DB_NAME:-jira}
      POSTGRES_USER: ${JIRA_DB_USER:-jira}
      POSTGRES_PASSWORD: ${JIRA_DB_PASSWORD:?Defini JIRA_DB_PASSWORD en .env}
    volumes:
      - jira_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jira-net

  jira:
    image: atlassian/jira-software:10.3.22-jdk17-r9
    container_name: easycommerce-jira
    restart: unless-stopped
    ports:
      - "127.0.0.1:${JIRA_PORT:-8080}:8080"
    environment:
      ATL_JDBC_URL: jdbc:postgresql://jira-db:5432/${JIRA_DB_NAME:-jira}
      ATL_JDBC_USER: ${JIRA_DB_USER:-jira}
      ATL_JDBC_PASSWORD: ${JIRA_DB_PASSWORD:?Defini JIRA_DB_PASSWORD en .env}
      ATL_DB_DRIVER: org.postgresql.Driver
      ATL_DB_TYPE: postgres72
      JVM_MINIMUM_MEMORY: 1024m
      JVM_MAXIMUM_MEMORY: 2048m
    volumes:
      - jira_data:/var/atlassian/application-data/jira
    depends_on:
      jira-db:
        condition: service_healthy
    networks:
      - jira-net
      - easycommerce-network

  # ---------- Administracion de la BD ----------
  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: easycommerce-pgadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@easycommerce.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Defini PGADMIN_PASSWORD en .env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - easycommerce-network

  # ---------- Monitoreo ----------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: easycommerce-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    networks:
      - easycommerce-network

  grafana:
    image: grafana/grafana:11.1.0
    container_name: easycommerce-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Defini GRAFANA_PASSWORD en .env}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - easycommerce-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: easycommerce-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/${POSTGRES_DB:-easyecommerce}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER:-postgres}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?Defini POSTGRES_PASSWORD en .env}
    networks:
      - easycommerce-network

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: easycommerce-node-exporter
    restart: unless-stopped
    profiles: ["linux"]
    pid: host
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - easycommerce-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: easycommerce-cadvisor
    restart: unless-stopped
    profiles: ["linux"]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - easycommerce-network

  # ---------- Automatizacion ----------
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:?Defini N8N_VERSION en .env (version estable y parcheada)}
    container_name: easycommerce-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-America/Argentina/Jujuy}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Argentina/Jujuy}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
      NODE_ENV: production
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defini N8N_ENCRYPTION_KEY en .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.localFileTrigger","n8n-nodes-base.git","n8n-nodes-base.ssh"]'
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "true"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
    security_opt:
      - no-new-privileges:true
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - easycommerce-network

networks:
  easycommerce-network:
    external: true
    name: easycommerce-network
  jira-net:
    driver: bridge

volumes:
  jira_data:
  jira_db_data:
  pgadmin_data:
  prometheus_data:
  grafana_data:
  n8n_data: